<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SEGA+ — unlocking…</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;background:#222;
      color:#F4F2ED;font-family:system-ui,Helvetica,sans-serif;text-align:center;padding:2rem}
    .accent{color:#ff992b}
  </style>
</head>
<body>
  <h2 id="msg">Unlocking<span class="accent">…</span></h2>
  <script>
    (function () {
      // Token rides in the URL fragment, which the browser never sends to the
      // server — so it never appears in logs or Referer headers.
      var hash = window.location.hash || "";
      var token = "";
      var i = hash.indexOf("token=");
      if (i >= 0) token = decodeURIComponent(hash.substring(i + 6).split("&")[0]);

      var msg = document.getElementById("msg");
      if (!token) {
        msg.textContent = "No token — relaunch from the SEGA+ Launcher.";
        return;
      }
      fetch("/api/unlock", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: token }),
      })
        .then(function (r) {
          if (r.ok) {
            // replace() drops the #token entry from history entirely.
            window.location.replace("/");
          } else {
            msg.textContent = "Verification expired — relaunch from the SEGA+ Launcher.";
          }
        })
        .catch(function () {
          msg.textContent = "Network error — try again.";
        });
    })();
  </script>
</body>
</html>
