		<script>
			(function(){
				// ===================================================
				//  SET YOUR PASSWORD HERE  (one line, that's it)
				const SKID_PASSWORD = "CHANGE_ME";
				// ===================================================

				var gate = document.getElementById("skid-gate");
				var input = document.getElementById("skid-pass");
				var go = document.getElementById("skid-go");
				var err = document.getElementById("skid-err");
				var mark = document.getElementById("skid-mark");

				function showWatermark(){
					mark.classList.add("show");           // fade in
					setTimeout(function(){ mark.classList.remove("show"); }, 3000); // hold 3s then fade
					setTimeout(function(){ mark.remove(); }, 4000);                 // remove after fade-out
				}

				function unlock(){
					gate.classList.add("hidden");
					setTimeout(function(){ gate.remove(); }, 600);
					try { sessionStorage.setItem("skid-ok", "1"); } catch(e){}
					showWatermark();
				}

				function tryPass(){
					if (input.value === SKID_PASSWORD){
						unlock();
					} else {
						err.classList.add("show");
						input.value = "";
						input.focus();
					}
				}

				go.addEventListener("click", tryPass);
				input.addEventListener("keydown", function(e){
					if (e.key === "Enter") tryPass();
					else err.classList.remove("show");
				});

				// Already unlocked this browser session? skip the gate, still show the watermark.
				try {
					if (sessionStorage.getItem("skid-ok") === "1"){
						gate.remove();
						showWatermark();
					}
				} catch(e){}
			})();
